name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          echo "Files in repo root:"
          ls -la
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Found zip: $ZIP"
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d .
          else
            echo "No zip file found!"
            exit 1
          fi
          echo "After unzip:"
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MafiaPixel-APK
          path: android/build/outputs/apk/debug/*.apk
